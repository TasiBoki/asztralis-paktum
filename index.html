<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ UNIVERZUM // ASZTRÁLIS PAKTUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(147, 51, 234, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 50% 120%, rgba(220, 38, 38, 0.1) 0%, transparent 60%);
            overflow-x: hidden;
        }
        .cyber-font { font-family: 'Orbitron', sans-serif; }
        .cyber-box {
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(147, 51, 234, 0.3);
            box-shadow: 0 0 25px rgba(147, 51, 234, 0.15);
        }
        .neon-text { text-shadow: 0 0 12px rgba(168, 85, 247, 0.6); }
        .red-neon { text-shadow: 0 0 12px rgba(239, 68, 68, 0.6); }

        @keyframes universePulse {
            0% { transform: scale(0.95); opacity: 0.4; filter: hue-rotate(0deg); }
            50% { transform: scale(1.05); opacity: 0.8; filter: hue-rotate(20deg); }
            100% { transform: scale(0.95); opacity: 0.4; filter: hue-rotate(0deg); }
        }
        @keyframes floatStars {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(180deg); }
            100% { transform: translateY(0px) rotate(360deg); }
        }
        .animate-universe { animation: universePulse 8s ease-in-out infinite; }
        .animate-stars { animation: floatStars 20s linear infinite; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-purple-600 selection:text-white">

    <!-- ASZTRÁLIS HÁTTÉRZENE -->
    <audio id="bg-audio" loop preload="auto">
        <source src="bg-music.mp3" type="audio/mpeg">
        A böngésződ nem támogatja a hangfájlok lejátszását.
    </audio>

    <!-- INTRO KÉPERNYŐ -->
    <div id="intro-screen" class="fixed inset-0 z-50 bg-[#030712] flex flex-col items-center justify-center p-6 text-center transition-opacity duration-1000">
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-purple-900/30 via-slate-950/80 to-[#030712] pointer-events-none animate-universe"></div>
        <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:24px_24px] animate-stars pointer-events-none"></div>

        <div class="relative z-10 space-y-6 max-w-sm">
            <div class="inline-block p-6 rounded-full bg-purple-950/40 border border-purple-500/40 shadow-[0_0_30px_rgba(147,51,234,0.4)] animate-bounce">
                ✨
            </div>
            <div class="space-y-2">
                <h1 class="cyber-font text-2xl sm:text-3xl font-black tracking-widest text-purple-300 neon-text">AZ UNIVERZUM</h1>
                <p class="text-xs font-mono text-slate-400 tracking-wider">A sors és a karmikus paktumok mezője</p>
            </div>
            
            <div class="pt-4">
                <button onclick="enterUniverse()" class="cyber-font w-full bg-gradient-to-r from-purple-600 via-indigo-600 to-purple-700 hover:from-purple-500 hover:to-indigo-600 text-white font-bold py-4 rounded-xl transition shadow-[0_0_25px_rgba(147,51,234,0.6)] tracking-wider uppercase text-xs border border-purple-400/50 active:scale-95 cursor-pointer">
                    Belépés a Mezőre
                </button>
            </div>
        </div>
    </div>

    <!-- HANG VEZÉRLŐ GOMB -->
    <button id="sound-toggle" onclick="toggleMusic()" class="fixed top-4 right-4 z-40 hidden bg-slate-900/80 border border-purple-500/40 text-purple-300 p-2.5 rounded-full shadow-[0_0_10px_rgba(147,51,234,0.3)] hover:bg-purple-950 transition text-xs font-mono items-center gap-1.5 cursor-pointer">
        <span id="sound-icon">🎵</span> <span id="sound-text" class="hidden sm:inline">Háttérzene Be</span>
    </button>

    <!-- FŐ ALKALMAZÁS -->
    <div class="w-full max-w-md">
        <div class="cyber-box rounded-2xl p-6 sm:p-8" id="card-container"></div>
    </div>

    <script>
        const API_URL = 'https://asztralis-paktum.onrender.com';
        let countdownTimer = null;
        let currentViewMode = '';
        let isMusicPlaying = false;

        // Videó rögzítési változók
        let mediaRecorder;
        let recordedChunks = [];
        let recordedVideoBlob = null;
        let cameraStream = null;

        function enterUniverse() {
            const audio = document.getElementById('bg-audio');
            audio.play().then(() => {
                isMusicPlaying = true;
                document.getElementById('sound-toggle').classList.remove('hidden');
                document.getElementById('sound-toggle').classList.add('flex');
            }).catch(error => {
                console.log("Audio lejátszási hiba:", error);
            });

            const intro = document.getElementById('intro-screen');
            if (intro) {
                intro.style.opacity = '0';
                setTimeout(() => {
                    intro.style.display = 'none';
                    checkStatusAndRender(true);
                }, 1000);
            }
        }

        function toggleMusic() {
            const audio = document.getElementById('bg-audio');
            const icon = document.getElementById('sound-icon');
            const text = document.getElementById('sound-text');

            if (isMusicPlaying) {
                audio.pause();
                isMusicPlaying = false;
                icon.innerText = '🔇';
                text.innerText = 'Háttérzene Ki';
            } else {
                audio.play();
                isMusicPlaying = true;
                icon.innerText = '🎵';
                text.innerText = 'Háttérzene Be';
            }
        }

        function pauseMusicForVideo() {
            const audio = document.getElementById('bg-audio');
            if (isMusicPlaying) {
                audio.pause();
            }
        }

        function resumeMusicAfterVideo() {
            const audio = document.getElementById('bg-audio');
            if (isMusicPlaying) {
                audio.play().catch(e => console.log(e));
            }
        }

        function getStoredUser() {
            return {
                username: localStorage.getItem('sors_username') || '',
                phone: localStorage.getItem('sors_phone') || ''
            };
        }

        async function checkStatusAndRender(isInitial = false) {
            const user = getStoredUser();
            
            // Ha nincsenek elmentett adatok, mindenképpen az azonosító (login) képernyőre jön
            if (!user.username || !user.phone) {
                if (currentViewMode !== 'login') {
                    renderLoginView();
                }
                return;
            }

            try {
                const res = await fetch(`${API_URL}/check-user/${encodeURIComponent(user.username)}/${encodeURIComponent(user.phone)}`);
                const data = await res.json();

                if (data.status === 'banned') {
                    renderBannedView(user.username, user.phone);
                } else if (data.status === 'none') {
                    // Ha a lokális tárban van név/telefon, de a szerver szerint még nincs adat (pl. törölve lett),
                    // akkor kérjük meg újra a bejelentkezésre.
                    localStorage.removeItem('sors_username');
                    localStorage.removeItem('sors_phone');
                    if (currentViewMode !== 'login') {
                        renderLoginView();
                    }
                } else if (data.status === 'expired') {
                    // Ha lejárt az idő, töröljük a lokális adatot, és dobjuk át a bejelentkezőre egy üzenettel
                    localStorage.removeItem('sors_username');
                    localStorage.removeItem('sors_phone');
                    if (currentViewMode !== 'login') {
                        renderLoginView('✨ Az előző paktumod ideje lejárt. Lépj be újra az új utazáshoz!');
                    }
                } else if (data.status === 'rejected') {
                    if (currentViewMode !== 'rejected') {
                        renderRejectedView(user.username, user.phone, data.reject_reason);
                    }
                } else if (data.status === 'active') {
                    if (currentViewMode !== 'active') {
                        renderActiveView(user.username, user.phone, data.expires_at);
                    }
                }
            } catch (err) {
                console.error("Hiba státusz lekérdezéskor:", err);
                if (currentViewMode !== 'login' && isInitial) {
                    renderLoginView();
                }
            }
        }

        // 1. LÉPÉS: AZONOSÍTÓ / BELÉPÉS NÉZET (Csak név és telefonszám)
        function renderLoginView(noticeMessage = '') {
            if (countdownTimer) clearInterval(countdownTimer);
            currentViewMode = 'login';
            const container = document.getElementById('card-container');

            let noticeHtml = noticeMessage ? `
                <div class="mb-5 p-3 rounded-xl bg-purple-950/40 border border-purple-500/30 text-purple-300 text-xs font-mono text-center">
                    ${noticeMessage}
                </div>
            ` : '';

            container.innerHTML = `
                ${noticeHtml}
                <div class="text-center mb-6">
                    <h1 class="cyber-font text-2xl font-black tracking-wider text-purple-400 mb-2 neon-text">AZONOSÍTÁS</h1>
                    <p class="text-xs text-slate-300 font-light leading-relaxed">
                        Add meg adataid az Univerzum mezőbe való belépéshez:
                    </p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-[11px] uppercase font-mono tracking-widest text-purple-400 mb-1.5">Neved / Azonosítód</label>
                        <input type="text" id="login-username" class="w-full bg-slate-950/90 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-purple-500 font-mono text-sm transition" placeholder="Pl. TasiBoki">
                    </div>
                    <div>
                        <label class="block text-[11px] uppercase font-mono tracking-widest text-purple-400 mb-1.5">Telefonszámod</label>
                        <input type="text" id="login-phone" class="w-full bg-slate-950/90 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-purple-500 font-mono text-sm transition" placeholder="Pl. +36301234567">
                    </div>

                    <button onclick="handleLoginAttempt()" class="cyber-font w-full bg-gradient-to-r from-purple-600 via-indigo-600 to-purple-700 hover:from-purple-500 hover:to-indigo-600 text-white font-bold py-3.5 rounded-xl transition shadow-[0_0_20px_rgba(147,51,234,0.4)] tracking-wider uppercase text-sm border border-purple-400/40 active:scale-95 cursor-pointer">
                        Tovább a Mezőre
                    </button>
                </div>

                <div id="login-message" class="mt-3 text-center text-xs font-mono min-h-[20px]"></div>
            `;
        }

        // Ellenőrzi a megadott név/telefont, és a státusz alapján irányít
        async function handleLoginAttempt() {
            const usernameInput = document.getElementById('login-username');
            const phoneInput = document.getElementById('login-phone');
            const msgDiv = document.getElementById('login-message');

            const username = usernameInput ? usernameInput.value.trim() : '';
            const phone = phoneInput ? phoneInput.value.trim() : '';

            if (!username || !phone) {
                if (msgDiv) {
                    msgDiv.innerText = "Kérlek add meg a neved és a telefonszámod!";
                    msgDiv.className = "mt-3 text-center text-xs font-mono text-red-400";
                }
                return;
            }

            // Elmentjük ideiglenesen
            localStorage.setItem('sors_username', username);
            localStorage.setItem('sors_phone', phone);

            try {
                const res = await fetch(`${API_URL}/check-user/${encodeURIComponent(username)}/${encodeURIComponent(phone)}`);
                const data = await res.json();

                if (data.status === 'banned') {
                    renderBannedView(username, phone);
                } else if (data.status === 'rejected') {
                    renderRejectedView(username, phone, data.reject_reason);
                } else if (data.status === 'active') {
                    // Ha van aktív paktuma, irány a visszaszámláló!
                    renderActiveView(username, phone, data.expires_at);
                } else {
                    // Ha status 'none' vagy 'expired', akkor ez egy új kívánságküldési alkalom!
                    renderWishFormView(username, phone, data.status === 'expired');
                }
            } catch (err) {
                console.error("Hiba azonosításkor:", err);
                if (msgDiv) {
                    msgDiv.innerText = "Nem sikerült csatlakozni az Univerzumhoz.";
                    msgDiv.className = "mt-3 text-center text-xs font-mono text-red-400";
                }
            }
        }

        // 2. LÉPÉS: KÍVÁNSÁG BEKÜLDÖ FELÜLET (Csak akkor látszik, ha nincs aktív paktuma)
        function renderWishFormView(username, phone, wasExpired = false) {
            if (countdownTimer) clearInterval(countdownTimer);
            currentViewMode = 'wish-form';
            const container = document.getElementById('card-container');
            
            let noticeHtml = wasExpired ? `
                <div class="mb-5 p-3 rounded-xl bg-purple-950/40 border border-purple-500/30 text-purple-300 text-xs font-mono text-center">
                    ✨ Az előző időd lejárt, az Univerzum kapui újra megnyíltak.
                </div>
            ` : `
                <div class="mb-5 p-3 rounded-xl bg-purple-950/40 border border-purple-500/30 text-purple-300 text-xs font-mono text-center">
                    ✨ Üdvözöllek, ${username}! Add meg a legújabb paktumodat:
                </div>
            `;

            container.innerHTML = `
                ${noticeHtml}
                <div class="flex gap-2 mb-4 bg-slate-950 p-1 rounded-xl border border-slate-800">
                    <button onclick="switchInputMode('text')" id="mode-text-btn" class="flex-1 py-2 text-xs font-mono rounded-lg transition bg-purple-900/60 text-purple-200 cursor-pointer">✍️ Írott</button>
                    <button onclick="switchInputMode('video')" id="mode-video-btn" class="flex-1 py-2 text-xs font-mono rounded-lg transition text-slate-400 hover:text-white cursor-pointer">🎥 Videó</button>
                </div>

                <div class="space-y-4">
                    <!-- ÍROTT KÍVÁNSÁG MEZŐ -->
                    <div id="input-section-text">
                        <label class="block text-[11px] uppercase font-mono tracking-widest text-purple-400 mb-1.5">A kívánságod (Szöveg)</label>
                        <textarea id="wish" rows="4" class="w-full bg-slate-950/90 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-purple-500 text-sm transition resize-none" placeholder="Fogalmazd meg tisztán és tiszta szívből..."></textarea>
                    </div>

                    <!-- VIDEÓS KÍVÁNSÁG MEZŐ (Alapból rejtett) -->
                    <div id="input-section-video" class="hidden space-y-3">
                        <label class="block text-[11px] uppercase font-mono tracking-widest text-purple-400 mb-1.5">Kamerás Felvétel</label>
                        <div class="relative rounded-xl overflow-hidden border border-purple-500/30 bg-black aspect-video flex items-center justify-center">
                            <video id="camera-preview" class="w-full h-full object-cover hidden" autoplay muted playsinline></video>
                            <video id="video-playback" class="w-full h-full object-cover hidden" controls playsinline></video>
                            <div id="camera-placeholder" class="text-xs font-mono text-slate-500 text-center p-4">
                                A kamera még nincs bekapcsolva.<br>Kattints a felvétel indítására!
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button type="button" onclick="startCameraRecording()" id="rec-start-btn" class="flex-1 bg-red-950/60 border border-red-500/40 hover:bg-red-900/60 text-red-300 text-xs font-mono py-2.5 rounded-lg transition cursor-pointer">🔴 Felvétel Indítása</button>
                            <button type="button" onclick="stopCameraRecording()" id="rec-stop-btn" disabled class="flex-1 bg-slate-800 text-slate-500 text-xs font-mono py-2.5 rounded-lg transition cursor-not-allowed">⏹️ Leállítás</button>
                        </div>
                    </div>

                    <button onclick="submitWish()" class="cyber-font w-full bg-gradient-to-r from-purple-600 via-indigo-600 to-purple-700 hover:from-purple-500 hover:to-indigo-600 text-white font-bold py-3.5 rounded-xl transition shadow-[0_0_20px_rgba(147,51,234,0.4)] tracking-wider uppercase text-sm border border-purple-400/40 active:scale-95 cursor-pointer">
                        Kívánság Elküldése
                    </button>
                    
                    <button onclick="logoutUser()" class="w-full text-center text-[10px] font-mono text-slate-500 hover:text-slate-300 underline pt-1 cursor-pointer">
                        Vissza a belépéshez / Más adatok megadása
                    </button>
                </div>

                <div id="message" class="mt-3 text-center text-xs font-mono min-h-[20px]"></div>
            `;
        }

        function switchInputMode(mode) {
            const textSec = document.getElementById('input-section-text');
            const videoSec = document.getElementById('input-section-video');
            const textBtn = document.getElementById('mode-text-btn');
            const videoBtn = document.getElementById('mode-video-btn');

            if (mode === 'text') {
                textSec.classList.remove('hidden');
                videoSec.classList.add('hidden');
                textBtn.className = "flex-1 py-2 text-xs font-mono rounded-lg transition bg-purple-900/60 text-purple-200 cursor-pointer";
                videoBtn.className = "flex-1 py-2 text-xs font-mono rounded-lg transition text-slate-400 hover:text-white cursor-pointer";
                
                stopCameraStream();
                resumeMusicAfterVideo();
            } else {
                textSec.classList.add('hidden');
                videoSec.classList.remove('hidden');
                videoBtn.className = "flex-1 py-2 text-xs font-mono rounded-lg transition bg-purple-900/60 text-purple-200 cursor-pointer";
                textBtn.className = "flex-1 py-2 text-xs font-mono rounded-lg transition text-slate-400 hover:text-white cursor-pointer";
                
                pauseMusicForVideo();
            }
        }

        async function startCameraRecording() {
            recordedChunks = [];
            recordedVideoBlob = null;
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const previewEl = document.getElementById('camera-preview');
                const playbackEl = document.getElementById('video-playback');
                const placeholderEl = document.getElementById('camera-placeholder');

                playbackEl.classList.add('hidden');
                previewEl.classList.remove('hidden');
                placeholderEl.classList.add('hidden');

                previewEl.srcObject = cameraStream;
                previewEl.play();

                mediaRecorder = new MediaRecorder(cameraStream);
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    recordedVideoBlob = new Blob(recordedChunks, { type: 'video/webm' });
                    const videoUrl = URL.createObjectURL(recordedVideoBlob);
                    
                    previewEl.classList.add('hidden');
                    playbackEl.src = videoUrl;
                    playbackEl.classList.remove('hidden');
                };

                mediaRecorder.start();

                document.getElementById('rec-start-btn').disabled = true;
                document.getElementById('rec-start-btn').className = "flex-1 bg-slate-800 text-slate-500 text-xs font-mono py-2.5 rounded-lg transition cursor-not-allowed";
                
                document.getElementById('rec-stop-btn').disabled = false;
                document.getElementById('rec-stop-btn').className = "flex-1 bg-red-950/60 border border-red-500/40 hover:bg-red-900/60 text-red-300 text-xs font-mono py-2.5 rounded-lg transition cursor-pointer";

            } catch (err) {
                alert("Nem sikerült elérni a kamerát. Kérlek engedélyezd a böngésződben!");
            }
        }

        function stopCameraRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            stopCameraStream();

            document.getElementById('rec-start-btn').disabled = false;
            document.getElementById('rec-start-btn').className = "flex-1 bg-red-950/60 border border-red-500/40 hover:bg-red-900/60 text-red-300 text-xs font-mono py-2.5 rounded-lg transition cursor-pointer";
            
            document.getElementById('rec-stop-btn').disabled = true;
            document.getElementById('rec-stop-btn').className = "flex-1 bg-slate-800 text-slate-500 text-xs font-mono py-2.5 rounded-lg transition cursor-not-allowed";
        }

        function stopCameraStream() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
        }

        function renderBannedView(username, phone) {
            if (countdownTimer) clearInterval(countdownTimer);
            currentViewMode = 'banned';
            const container = document.getElementById('card-container');
            container.innerHTML = `
                <div class="text-center space-y-5 py-6">
                    <div class="inline-block p-4 rounded-full bg-red-950/80 border border-red-500/50 text-red-500 text-xl animate-pulse">
                        ⛔
                    </div>
                    <h3 class="cyber-font text-lg font-black text-red-500 red-neon">VÉGLEGESEN LETILTVA</h3>
                    <p class="text-xs font-mono text-slate-300">Név: <span class="text-red-400">${username}</span><br>Tel: <span class="text-red-400">${phone}</span></p>
                    <button onclick="logoutUser()" class="text-[10px] font-mono text-slate-500 hover:text-slate-300 underline pt-2 cursor-pointer">
                        Másik fiók / Adatok törlése ezen a telefonon
                    </button>
                </div>
            `;
        }

        function renderRejectedView(username, phone, reason) {
            if (countdownTimer) clearInterval(countdownTimer);
            currentViewMode = 'rejected';
            const container = document.getElementById('card-container');
            container.innerHTML = `
                <div class="text-center space-y-4 py-4">
                    <div class="inline-block p-3 rounded-full bg-red-950/50 border border-red-500/30 text-red-400 mb-1">⚠️</div>
                    <h3 class="cyber-font text-base text-red-400">A Paktum elutasításra került</h3>
                    <div class="p-4 rounded-xl bg-red-950/30 border border-red-500/40 text-left space-y-1">
                        <div class="text-[10px] font-mono text-red-400 uppercase tracking-widest">Admin üzenete:</div>
                        <p class="text-xs text-slate-200 font-mono">${reason}</p>
                    </div>
                    <button onclick="logoutUser()" class="cyber-font w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3 rounded-xl transition text-xs uppercase cursor-pointer">Új Kívánság Leadása</button>
                </div>
            `;
        }

        async function submitWish() {
            stopCameraStream();
            const user = getStoredUser();
            const username = user.username;
            const phone = user.phone;
            const msgDiv = document.getElementById('message');

            const isVideoMode = !document.getElementById('input-section-video').classList.contains('hidden');
            const wishText = isVideoMode ? "[Videós Kívánság]" : (document.getElementById('wish') ? document.getElementById('wish').value.trim() : '');

            if ((!wishText && !recordedVideoBlob)) {
                if (msgDiv) {
                    msgDiv.innerText = "Kérlek írd be a kívánságod vagy rögzíts videót!";
                    msgDiv.className = "mt-3 text-center text-xs font-mono text-red-400";
                }
                return;
            }

            const container = document.getElementById('card-container');
            container.innerHTML = `
                <div class="text-center py-10 space-y-4">
                    <div class="inline-block p-4 rounded-full bg-purple-950/50 border border-purple-500/30 text-purple-400 mb-2 animate-bounce">✨</div>
                    <h3 class="cyber-font text-lg text-purple-300 neon-text">Az Univerzum fogadta a Paktumod.</h3>
                    <p class="text-xs text-slate-400 font-mono">Kapcsolódás a mezőhöz...</p>
                </div>
            `;

            try {
                let response;
                if (isVideoMode && recordedVideoBlob) {
                    const formData = new FormData();
                    formData.append('username', username);
                    formData.append('phone', phone);
                    formData.append('video', recordedVideoBlob, 'wish.webm');
                    
                    response = await fetch(`${API_URL}/submit-wish-video`, {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    response = await fetch(`${API_URL}/submit-wish`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, phone, wish: wishText })
                    });
                }

                if (response.ok) {
                    setTimeout(() => { checkStatusAndRender(true); }, 2500);
                } else {
                    renderWishFormView(username, phone);
                    resumeMusicAfterVideo();
                }
            } catch (error) {
                renderWishFormView(username, phone);
                resumeMusicAfterVideo();
                alert("Nem sikerült csatlakozni az Univerzumhoz.");
            }
        }

        function renderActiveView(username, phone, expiresAtIso) {
            currentViewMode = 'active';
            resumeMusicAfterVideo(); 
            const container = document.getElementById('card-container');
            
            container.innerHTML = `
                <div class="text-center space-y-5 py-2">
                    <div class="inline-block p-3 rounded-full bg-red-950/40 border border-red-500/30 text-red-400">⏳</div>
                    <div class="space-y-2">
                        <h3 class="cyber-font text-sm font-bold text-slate-200">Számolj bátran vissza...</h3>
                        <p class="text-xs text-purple-300 font-light italic leading-relaxed">"...és ne feledd, a csoda bármelyik pillanatban megérkezhet."</p>
                    </div>
                    <div class="p-5 rounded-xl bg-slate-950/80 border border-red-500/30 shadow-[0_0_15px_rgba(239,68,68,0.15)]">
                        <div class="text-[10px] text-red-400 uppercase tracking-widest font-mono mb-1">Hátralévő idő</div>
                        <div id="countdown-display" class="cyber-font text-3xl font-black text-red-500 red-neon">00:00:00</div>
                    </div>
                    <button onclick="logoutUser()" class="text-[10px] font-mono text-slate-500 hover:text-slate-300 underline pt-2 cursor-pointer">Kilépés / Másik adatok megadása</button>
                </div>
            `;

            const targetTime = new Date(expiresAtIso).getTime();
            if (countdownTimer) clearInterval(countdownTimer);

            countdownTimer = setInterval(() => {
                const now = new Date().getTime();
                const distance = targetTime - now;

                if (distance <= 0) {
                    clearInterval(countdownTimer);
                    checkStatusAndRender(true);
                    return;
                }

                const secondsTotal = Math.floor(distance / 1000);
                const hrs = Math.floor(secondsTotal / 3600);
                const mins = Math.floor((secondsTotal % 3600) / 60);
                const secs = secondsTotal % 60;

                const displayEl = document.getElementById('countdown-display');
                if (displayEl) {
                    displayEl.innerText = String(hrs).padStart(2, '0') + ":" + String(mins).padStart(2, '0') + ":" + String(secs).padStart(2, '0');
                }
            }, 1000);
        }

        function logoutUser() {
            localStorage.removeItem('sors_username');
            localStorage.removeItem('sors_phone');
            if (countdownTimer) clearInterval(countdownTimer);
            resumeMusicAfterVideo();
            renderLoginView();
        }
    </script>
</body>
</html>
